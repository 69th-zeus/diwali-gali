<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0920">
<title>Diwali Gali – light a cracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Baloo+Chettan+2:wght@700&family=Baloo+Da+2:wght@700&family=Baloo+Tamma+2:wght@700&family=Baloo+Tammudu+2:wght@700&family=Baloo+Thambi+2:wght@700&family=Yatra+One&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --night:#0a0920;
  --flame:#ffb238;
  --kumkum:#c8202a;
  --haldi:#fcebc4;
  --label:#f7d23e;
  --label-ink:#2b0d0a;
  --label-sub:#6a2412;
  --label-edge:#c8202a;
  --label-drop:#6e0f12;
  --chip-bg:rgba(252,235,196,.93);
  --chip-ink:#2b0d0a;
  --btn-bg:#c8202a;
  --btn-ink:#fff4dc;
  --ghost-ink:#2b0d0a;
  --focus:#1d4ed8;
  --f-body:"Baloo 2","Baloo Tamma 2","Baloo Tammudu 2","Baloo Thambi 2","Baloo Chettan 2","Baloo Da 2",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"Yatra One","Baloo 2",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --label:#1c1544;--label-ink:#fcebc4;--label-sub:#e9b98c;--label-edge:#f7d23e;--label-drop:#000;
    --chip-bg:rgba(22,16,56,.9);--chip-ink:#fcebc4;--ghost-ink:#fcebc4;--focus:#ffd76a;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --label:#1c1544;--label-ink:#fcebc4;--label-sub:#e9b98c;--label-edge:#f7d23e;--label-drop:#000;
  --chip-bg:rgba(22,16,56,.9);--chip-ink:#fcebc4;--ghost-ink:#fcebc4;--focus:#ffd76a;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--haldi);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#04030f}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
kbd{font:inherit}

/* HUD */
.hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 0;pointer-events:none;transition:opacity .6s ease}
.brand{font-family:var(--f-display);font-size:23px;line-height:1;color:var(--haldi);text-shadow:0 0 14px rgba(255,160,60,.6);display:flex;align-items:center;gap:8px;margin:0;font-weight:400}
.brand svg{width:26px;height:22px}
.brand-wrap{display:flex;flex-direction:column;gap:4px}
.credit{margin:0 0 0 34px;font:600 12px/1 var(--f-body);color:rgba(252,235,196,.72)}
.credit b{color:var(--flame);font-weight:800}
.hud-right{display:flex;gap:6px;pointer-events:auto}
.chip{font:700 15px/1 var(--f-body);color:var(--chip-ink);background:var(--chip-bg);border:0;border-radius:999px;padding:7px 11px 6px;display:inline-flex;align-items:center;gap:5px;min-height:34px;box-shadow:0 3px 14px rgba(0,0,0,.3)}
button.chip{cursor:pointer;min-width:38px;justify-content:center}
.prompt{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 58px);left:50%;transform:translateX(-50%);margin:0;max-width:min(92vw,500px);width:max-content;text-align:center;font:600 16px/1.3 var(--f-body);color:var(--chip-ink);background:var(--chip-bg);padding:8px 16px 7px;border-radius:18px;pointer-events:none;transition:opacity .25s ease;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.prompt.off{opacity:0}
body:not(.playing) .hud,body:not(.playing) .prompt{opacity:0}

/* Cracker tray: each cracker is a little Sivakasi-printed box */
.tray{position:fixed;left:0;right:0;bottom:0;z-index:6;overflow-x:auto;overflow-y:hidden;padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 12px);background:linear-gradient(to top,rgba(5,4,15,.95) 0,rgba(5,4,15,.78) 68%,rgba(5,4,15,0));scrollbar-width:none;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.tray::-webkit-scrollbar{display:none}
body:not(.playing) .tray{transform:translateY(115%)}
.tray-inner{display:flex;gap:10px;width:max-content;margin:0 auto;padding:8px 4px 2px}
.box{position:relative;flex:0 0 auto;width:102px;padding:6px 6px 8px;border:2px solid var(--label-edge);border-radius:7px;background:var(--label);color:var(--label-ink);box-shadow:0 3px 0 var(--label-drop);font:inherit;text-align:center;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,opacity .2s}
.box::before{content:"";position:absolute;inset:3px;border:1px dashed var(--label-edge);border-radius:4px;opacity:.5;pointer-events:none}
.box svg{display:block;width:48px;height:40px;margin:2px auto 3px}
.box b{display:block;font-weight:800;font-size:15px;line-height:1.05}
.box small{display:block;font-weight:600;font-size:12px;line-height:1.2;color:var(--label-sub);margin-top:3px}
.box kbd{position:absolute;top:6px;right:8px;font-weight:700;font-size:11px;line-height:1;color:var(--label-sub);opacity:.75}
@media (hover:hover){.box:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 var(--label-drop)}}
.box[aria-pressed="true"]{transform:translateY(-5px);box-shadow:0 8px 0 var(--label-drop),0 0 0 3px var(--flame),0 0 24px rgba(255,178,56,.55)}
.box:disabled{opacity:.42;cursor:not-allowed}
@media (pointer:coarse){.box kbd{display:none}}

/* Result card */
.card{position:fixed;z-index:8;top:calc(env(safe-area-inset-top,0px) + 56px);left:50%;width:min(92vw,400px);transform:translate(-50%,-10px) scale(.95);opacity:0;transition:opacity .22s ease,transform .32s cubic-bezier(.2,.9,.3,1.35);background:var(--label);color:var(--label-ink);border:3px solid var(--label-edge);border-radius:10px;box-shadow:0 6px 0 var(--label-drop),0 18px 44px rgba(0,0,0,.5);padding:16px 18px 18px;text-align:center}
.card::before{content:"";position:absolute;inset:5px;border:1px dashed var(--label-edge);border-radius:6px;opacity:.45;pointer-events:none}
.card.show{opacity:1;transform:translate(-50%,0) scale(1)}
.card[hidden]{display:none}
.card-emoji{font-size:34px;line-height:1.1}
.card h2{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,8vw,36px);line-height:1.05;margin:4px 0 6px}
.card p{margin:0 auto;max-width:32ch;font-size:16px;line-height:1.35}
.card .q{margin-top:12px;font-weight:800;font-size:18px}
.card-btns{position:relative;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.btn{font:700 16px/1 var(--f-body);border-radius:8px;padding:11px 15px 10px;cursor:pointer;border:2px solid currentColor}
.btn.primary{background:var(--btn-bg);color:var(--btn-ink);border-color:var(--btn-bg);box-shadow:0 3px 0 var(--label-drop)}
.btn.ghost{background:transparent;color:var(--ghost-ink)}
.btn kbd{font-size:13px;opacity:.8;margin-left:6px}
@media (pointer:coarse){.btn kbd{display:none}}

/* Greeting */
.intro{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 20px calc(env(safe-area-inset-bottom,0px) + 24px);background:radial-gradient(ellipse 80% 70% at 50% 45%,rgba(10,8,32,.55),rgba(4,3,14,.93) 80%);transition:opacity .9s ease,visibility .9s;overflow:auto}
.intro.leave{opacity:0;visibility:hidden}
.intro-inner{position:relative;text-align:center;max-width:680px;display:flex;flex-direction:column;align-items:center;isolation:isolate}
.rangoli{position:absolute;left:50%;top:42%;width:min(92vw,580px);aspect-ratio:1;transform:translate(-50%,-50%);opacity:.13;pointer-events:none;z-index:-1;animation:spin 140s linear infinite}
.rangoli svg{width:100%;height:100%;display:block}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.greet{display:flex;flex-direction:column;align-items:center;gap:0;transition:opacity .45s ease;min-height:3.4em}
.greet.fade{opacity:0}
.greet span{font-weight:700;font-size:clamp(20px,5.2vw,36px);line-height:1.35;color:var(--flame);text-shadow:0 0 18px rgba(255,150,40,.6);white-space:nowrap}
.greet small{font-size:13px;font-weight:600;color:rgba(252,235,196,.62)}
.intro h1{font-family:var(--f-display);font-weight:400;font-size:clamp(56px,14vw,128px);line-height:.95;margin:6px 0 16px;color:#fff3d6;text-shadow:0 0 6px rgba(255,200,110,.65),0 0 30px rgba(255,140,40,.6),0 0 90px rgba(255,100,20,.4)}
.wish{font-size:clamp(16px,2.3vw,19px);line-height:1.45;max-width:36ch;margin:0 0 22px;color:rgba(252,235,196,.88)}
.diyarow{display:flex;gap:20px;margin:6px 0 30px}
.diya{position:relative;display:block;width:34px;height:13px;background:linear-gradient(#c4622d,#6e2810);border-radius:0 0 20px 20px/0 0 13px 13px}
.diya::before{content:"";position:absolute;left:-2px;right:-2px;top:-3px;height:6px;border-radius:50%;background:#df8a4c}
.diya i{position:absolute;left:50%;bottom:9px;width:11px;height:20px;margin-left:-5.5px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(ellipse 50% 60% at 50% 72%,#fff7cf 0 28%,#ffc93f 48%,#ff7a1a 78%,rgba(255,90,20,0) 100%);box-shadow:0 0 16px 6px rgba(255,170,50,.45);transform-origin:50% 100%;animation:flick 1.3s ease-in-out infinite alternate}
.diya:nth-child(2) i{animation-delay:-.4s}.diya:nth-child(3) i{animation-delay:-.8s}.diya:nth-child(4) i{animation-delay:-.2s}.diya:nth-child(5) i{animation-delay:-1s}
@keyframes flick{0%{transform:scale(1,1) rotate(-3deg)}45%{transform:scale(.9,1.1) rotate(2deg)}100%{transform:scale(1.05,.94) rotate(-1deg)}}
.start{position:relative;font:800 18px/1.1 var(--f-body);color:var(--label-ink);background:var(--label);border:3px solid var(--label-edge);border-radius:10px;padding:14px 22px 12px;box-shadow:0 5px 0 var(--label-drop),0 0 40px rgba(255,170,60,.25);cursor:pointer}
.start::before{content:"";position:absolute;inset:4px;border:1px dashed var(--label-edge);border-radius:6px;opacity:.5;pointer-events:none}
.start kbd{display:inline-block;padding:2px 7px 1px;margin:0 2px;border:2px solid currentColor;border-radius:5px;font-size:15px}
.start:active{transform:translateY(3px);box-shadow:0 2px 0 var(--label-drop)}
.k-touch{display:none}
@media (pointer:coarse){.k-desktop{display:none}.k-touch{display:inline}}
.soundnote{margin:14px 0 0;font-size:14px;color:rgba(252,235,196,.62)}
.madeby{margin:20px 0 0;font-size:16px;color:rgba(252,235,196,.78)}
.madeby b{color:var(--flame);font-weight:800;text-shadow:0 0 12px rgba(255,150,40,.5)}
@media (prefers-reduced-motion: reduce){.rangoli,.diya i{animation:none}.intro,.tray,.card,.greet,.prompt{transition:none}}
</style>
</head>
<body>
<canvas id="scene" role="img" aria-label="An Indian street on Diwali night, lit by diyas and string lights. Pick a cracker, strike the matchstick on the box and light the fuse."></canvas>

<header class="hud">
  <div class="brand-wrap"><p class="brand"><svg viewBox="0 0 26 22" aria-hidden="true"><path d="M2 13h22c-1 5-6 8-11 8S3 18 2 13z" fill="#c4622d"/><path d="M13 2c-3 4-4 6-3 9h6c1-3 0-5-3-9z" fill="#ffb238"/></svg>Diwali Gali</p><p class="credit">Made by <b>69th_zeus</b></p></div>
  <div class="hud-right">
    <span class="chip" id="scoreBoom" title="Crackers that went off"><span aria-hidden="true">💥</span><b>0</b><span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">went off</span></span>
    <span class="chip" id="scoreDud" title="Duds"><span aria-hidden="true">💨</span><b>0</b><span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">duds</span></span>
    <button class="chip" id="muteBtn" type="button" aria-pressed="false" aria-label="Mute sound">🔊</button>
  </div>
</header>
<p id="prompt" class="prompt off" role="status" aria-live="polite"></p>

<nav id="tray" class="tray" aria-label="Crackers"><div class="tray-inner" id="trayInner"></div></nav>

<div id="card" class="card" role="dialog" aria-labelledby="cardTitle" aria-describedby="cardSub" hidden>
  <div class="card-emoji" id="cardEmoji" aria-hidden="true">💥</div>
  <h2 id="cardTitle">Dhamaka!</h2>
  <p id="cardSub"></p>
  <p class="q">Try again?</p>
  <div class="card-btns">
    <button class="btn primary" id="btnAgain" type="button">Yes, light another<kbd>Enter</kbd></button>
    <button class="btn ghost" id="btnPick" type="button">Pick a different cracker</button>
  </div>
</div>

<div id="intro" class="intro">
  <div class="intro-inner">
    <div class="rangoli" id="rangoli" aria-hidden="true"></div>
    <div class="greet" id="greet" aria-hidden="true"><span id="greetLine" lang="hi">शुभ दीपावली</span><small id="greetLang">Hindi</small></div>
    <h1>Happy Diwali</h1>
    <p class="wish">May a thousand diyas light up your home, may the mithai never run out, and may every cracker you light tonight actually go off.</p>
    <div class="diyarow" aria-hidden="true"><span class="diya"><i></i></span><span class="diya"><i></i></span><span class="diya"><i></i></span><span class="diya"><i></i></span><span class="diya"><i></i></span></div>
    <button id="startBtn" class="start" type="button"><span class="k-desktop">Press <kbd>Enter</kbd> to step onto the street</span><span class="k-touch">Tap to step onto the street</span></button>
    <p class="soundnote">Turn your sound on. It gets loud.</p>
    <p class="madeby">Made by <b>69th_zeus</b></p>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const cv = $('#scene'), ctx = cv.getContext('2d');
const trayEl = $('#tray'), trayInner = $('#trayInner'), promptEl = $('#prompt'), cardEl = $('#card'), introEl = $('#intro');
const btnAgain = $('#btnAgain'), btnPick = $('#btnPick'), muteBtn = $('#muteBtn');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = matchMedia('(pointer: coarse)').matches;

/* ---------- helpers ---------- */
const TAU = Math.PI * 2;
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const pick = (arr, r = Math.random) => arr[Math.floor(r() * arr.length)];
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hexRgb(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
function shade(h,amt){const c=hexRgb(h),f=amt<0?0:255,a=Math.abs(amt);return `rgb(${Math.round(lerp(c[0],f,a))},${Math.round(lerp(c[1],f,a))},${Math.round(lerp(c[2],f,a))})`;}
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

/* ---------- palettes & data ---------- */
const WALLS = ['#8a659c','#9e7646','#4f7f79','#9c5559','#63834f','#6e7090','#a37c4a','#7c4f7a','#47697f','#93705c'];
const BULB_MULTI = [[255,70,70],[70,225,100],[80,140,255],[255,210,70],[255,90,215],[70,230,230]];
const KANDIL = [[255,90,60],[255,190,50],[90,200,255],[255,100,200],[130,230,120]];
const BOOM_COLS = [[255,255,235],[255,232,170],[255,200,110],[255,160,70]];
const PAPER_AIR = ['#d42a2a','#e8473a','#b51622','#c8202a','#f0c14b','#3a8a4a'];
const PAPER_GROUND = ['#8f1a20','#a3222a','#7a1218','#9b1d24','#a88a2a','#2f6338'];
const FAR_COLS = [[255,90,90],[110,200,255],[255,215,90],[140,255,150],[255,130,230],[255,240,220]];

const CR = {
  lakshmi:{name:'Lakshmi bomb',sub:'Loud and classic',fuse:2.4},
  sutli:{name:'Sutli bomb',sub:'The big one',fuse:3.1},
  anaar:{name:'Anaar',sub:'Flower pot',fuse:1.7},
  chakri:{name:'Chakri',sub:'Ground spinner',fuse:1.3},
  rocket:{name:'Rocket',sub:'Bottle launch',fuse:1.6},
  ladi:{name:'100-wala ladi',sub:'Cracker chain',fuse:1.8},
  snake:{name:'Saanp goli',sub:'Ash snake',fuse:1.0}
};
const ORDER = ['lakshmi','sutli','anaar','chakri','rocket','ladi','snake'];

const WIN = {
  lakshmi:{e:'💥',t:'Dhamaka!',s:'A proper Lakshmi bomb. The whole gali heard that one.'},
  sutli:{e:'💣',t:'Dhamaaaka!',s:'Sutli bomb delivered. Windows rattled three houses down.'},
  anaar:{e:'✨',t:'Waah!',s:'A golden fountain. Full paisa vasool.'},
  chakri:{e:'🌀',t:'Ghoom gaya!',s:'It spun like a top and chased everyone’s ankles.'},
  rocket:{e:'🚀',t:'Up it goes!',s:'Straight out of the bottle and into the sky.'},
  ladi:{e:'🎉',t:'Tada-tada-tada!',s:'The 100-wala went off. Well, most of it.'},
  snake:{e:'🐍',t:'Saanp nikla!',s:'Smelly, slow, and somehow still everyone’s favourite.'}
};
const DUDS = [
  {e:'💨',t:'Phusss… it went wuss',s:'Total dud. Must be last year’s stock.'},
  {e:'😒',t:'Phusss…',s:'All fuse, no dhamaka. The shopkeeper owes you ₹20.'},
  {e:'💨',t:'It went wuss',s:'That one was a “silent cracker”, apparently.'},
  {e:'🙄',t:'Phusss…',s:'Never walk back to check a dud. Here’s a fresh one instead.'}
];

const ICONS = {
  lakshmi:'<svg viewBox="0 0 48 40" aria-hidden="true"><ellipse cx="24" cy="36" rx="17" ry="2.6" fill="rgba(0,0,0,.25)"/><path d="M9 17 4 21l5 6zM39 17l5 4-5 6z" fill="#9e1218"/><rect x="8" y="13" width="32" height="21" rx="4" fill="#c8202a"/><rect x="16" y="16" width="16" height="14" rx="1" fill="#f7d23e"/><circle cx="24" cy="22.5" r="3.8" fill="#c8202a"/><rect x="16" y="27.5" width="16" height="2.5" fill="#2f6b3a"/><path d="M34 13c2-5 5-8 10-9" stroke="#6f7a45" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>',

function drawTank(c, x, y, w, h){

function drawDish(c, x, y, sz){

function drawWindow(c, x, y, w, h, rr){

function drawBalcony(c, bx, by, bw, rh, b, rr){

function addString(c, x1, y1, x2, y2, sag, rr){

function updateParts(k){
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= k; let dead = p.life <= 0;
    if (!dead) {
      if (p.t === 0) {
        const d = Math.pow(p.drag, k); p.vx *= d; p.vy = p.vy * d + p.g * k; p.x += p.vx * k; p.y += p.vy * k;
        if (p.fy !== undefined && p.y > p.fy && p.vy > 0) { p.y = p.fy; p.vy *= -0.28; p.vx *= 0.7; }
      } else if (p.t === 1) {
        p.vy += 0.14 * k; const d = Math.pow(0.965, k); p.vx *= d; p.vy *= d; p.ph += 0.25 * k;
        p.x += (p.vx + Math.sin(p.ph) * 0.7) * k; p.y += p.vy * k; p.rot += p.vr * k;
        if (p.vy > 0 && p.y >= p.fy) { stampPaper(p); dead = true; }

function drawCracker(c, o){

  if (state === 'strike') {
    const a = 0.6 + 0.35 * Math.sin(T * 4);
    c.fillStyle = `rgba(255,226,160,${a.toFixed(2)})`; c.font = '700 13px "Baloo 2", system-ui, sans-serif'; c.textAlign = 'center';
    c.fillText('← strike here →', x + w / 2, y - 8); c.textAlign = 'left';
  }
}

/* ---------- living scene ---------- */
function drawBulbs(c){
  c.globalCompositeOperation = 'lighter';
  for (const b of bulbs) {
    let v;
    if (b.mode === 'chase') v = Math.sin(T * b.sp - b.ph) > 0.15 ? 1 : 0.25;
    else if (b.mode === 'fall') v = 0.3 + 0.7 * Math.pow(Math.max(0, Math.sin(b.ph - T * b.sp)), 8);
    else v = 0.55 + 0.45 * Math.sin(T * b.sp + b.ph * 2.3);
    b.v = v; glowAt(c, b.x, b.y, 5 + 5 * v, b.col, 0.6 * v);
  }
  c.globalCompositeOperation = 'source-over';
  for (const b of bulbs) { c.fillStyle = `rgba(${b.cc},${(0.35 + 0.65 * b.v).toFixed(2)})`; c.fillRect(b.x - 1, b.y - 1, 2, 2.2); }
}
function drawDiyas(c){
  for (const d of diyas) {
    const f = 0.82 + 0.12 * Math.sin(T * 11 + d.ph) + 0.08 * Math.sin(T * 27.3 + d.ph * 2.3); d.f = f;
    c.fillStyle = '#6e2f16'; c.beginPath(); c.ellipse(d.x, d.y - 1.5, 4.6, 2.6, 0, 0, Math.PI); c.fill();
    c.fillStyle = '#a8542a'; c.beginPath(); c.ellipse(d.x, d.y - 1.6, 4.6, 1.2, 0, 0, TAU); c.fill();
    flame(c, d.x + 0.6, d.y - 2.6, 2.3 * f, 6.5 * f, Math.sin(T * 5 + d.ph) * 0.8);
  }
  c.globalCompositeOperation = 'lighter';
  for (const d of diyas) glowAt(c, d.x, d.y - 5, 20 * d.f, [255, 160, 60], 0.5);
  c.globalCompositeOperation = 'source-over';
}
function drawKandils(c){
  const R = 7 + 3 * L.s;
  for (const k of kandils) {
    const ang = Math.sin(T * 1.1 + k.ph) * 0.1, ex = k.x + Math.sin(ang) * k.len, ey = k.y + Math.cos(ang) * k.len;
    c.strokeStyle = 'rgba(20,14,20,0.9)'; c.lineWidth = 0.8; c.beginPath(); c.moveTo(k.x, k.y); c.lineTo(ex, ey); c.stroke();
    c.save(); c.translate(ex, ey + R); c.rotate(ang * 1.5);
    c.strokeStyle = rgba(k.col, 0.8); c.lineWidth = 1.2; c.beginPath();
    c.moveTo(-R * 0.4, R * 0.6); c.quadraticCurveTo(-R * 0.5, R * 1.5 + Math.sin(T * 3 + k.ph) * 2, -R * 0.3, R * 2.2);
    c.moveTo(R * 0.4, R * 0.6); c.quadraticCurveTo(R * 0.5, R * 1.5, R * 0.3, R * 2.2); c.stroke();
    c.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? R * 0.45 : R; c.lineTo(Math.cos(a) * rad, Math.sin(a) * rad); } c.closePath();
    c.fillStyle = rgba(k.col, 0.85); c.fill(); c.strokeStyle = 'rgba(255,240,200,0.7)'; c.lineWidth = 0.8; c.stroke();
    c.fillStyle = 'rgba(255,245,210,0.85)'; c.beginPath(); c.arc(0, 0, R * 0.28, 0, TAU); c.fill();
    c.restore(); k.gx = ex; k.gy = ey + R;
  }
  c.globalCompositeOperation = 'lighter';
  for (const k of kandils) glowAt(c, k.gx, k.gy, 40 * L.s + 14, k.col, 0.45);
  c.globalCompositeOperation = 'source-over';
}
function drawTVs(c){
  c.globalCompositeOperation = 'lighter';
  for (const t of tvs) { const v = 0.06 + 0.14 * Math.abs(Math.sin(T * 6.3 + t.ph) * Math.sin(T * 2.1 + t.ph * 1.7)); c.fillStyle = `rgba(130,170,255,${v.toFixed(3)})`; c.fillRect(t.x, t.y, t.w, t.h); }
  c.globalCompositeOperation = 'source-over';
}
function drawLamp(c){
  if (!lampHead) return;
  c.globalCompositeOperation = 'lighter';
  glowAt(c, lampHead.x, lampHead.y + 2, 60 * L.s + 20, [255, 150, 50], 0.85); glowAt(c, lampHead.x, lampHead.y + 1, 10, [255, 230, 180], 0.9);
  c.globalCompositeOperation = 'source-over';
}
function spawnFar(){
  const x = rand(W * 0.04, W * 0.96), y = rand(L.baseY * 0.1, L.baseY * 0.5), col = pick(FAR_COLS), v = rand(1.1, 1.9) * clamp(L.s, 0.7, 1.1);
  for (let i = 0; i < 46; i++) { const a = rand(TAU), sp = v * (0.35 + 0.65 * Math.sqrt(Math.random())); farParts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(40, 70), max: 70, col }); }
  farParts.push({ x, y, vx: 0, vy: 0, life: 10, max: 10, col: [255, 240, 220], flash: true });
  if (Snd.ready()) { const d = rand(0.4, 1.3), pan = (x / W * 2 - 1) * 0.8; Snd.boom(rand(0.6, 1), pan, d, { far: true }); if (Math.random() < 0.4) Snd.crackle(d + 0.2, 0.8, 20, 0.02, pan); }
}
function updateFar(k){
  if (T > nextFar) { nextFar = T + rand(1.4, 5); spawnFar(); }
  for (let i = farParts.length - 1; i >= 0; i--) {
    const p = farParts[i]; p.life -= k;
    if (p.life <= 0) { farParts[i] = farParts[farParts.length - 1]; farParts.pop(); continue; }
    const d = Math.pow(0.96, k); p.vx *= d; p.vy = p.vy * d + 0.025 * k; p.x += p.vx * k; p.y += p.vy * k;
  }
}
function drawFar(c){
  c.globalCompositeOperation = 'lighter';
  for (const p of farParts) {
    const f = p.life / p.max;
    if (p.flash) { glowAt(c, p.x, p.y, 60, p.col, 0.35 * f); continue; }
    c.globalAlpha = Math.min(1, f * 1.3) * 0.8; c.fillStyle = rgba(p.col, 1); c.fillRect(p.x - 0.8, p.y - 0.8, 1.6, 1.6); c.globalAlpha = 1;
    glowAt(c, p.x, p.y, 4, p.col, 0.25 * f);
  }
  c.globalCompositeOperation = 'source-over';
}
function drawSmoke(c){ for (const p of parts) if (p.t === 2) { c.globalAlpha = Math.max(0, p.a * (p.life / p.max)); c.drawImage(smokeSprite, p.x - p.r, p.y - p.r, p.r * 2, p.r * 2); } c.globalAlpha = 1; }
function drawPapers(c){
  for (const p of parts) if (p.t === 1) { c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.scale(1, Math.cos(p.ph * 0.7)); c.fillStyle = PAPER_AIR[p.ci]; c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); c.restore(); }
}
function drawSparks(c){
  c.globalCompositeOperation = 'lighter'; c.lineCap = 'round';
  for (const p of parts) {
    if (p.t !== 0) continue;
    const f = p.life / p.max, a = Math.min(1, f * 1.6);
    c.strokeStyle = rgba(p.col, a.toFixed(3)); c.lineWidth = p.size * (0.6 + 0.4 * f);
    c.beginPath(); c.moveTo(p.x - p.vx * 1.6, p.y - p.vy * 1.6); c.lineTo(p.x, p.y + 0.01); c.stroke();
    if (p.glow) glowAt(c, p.x, p.y, p.size * 6, p.col, a * 0.4);
  }
  c.globalCompositeOperation = 'source-over';
}
function drawLights(c){
  c.globalCompositeOperation = 'lighter';
  for (const l of lights) glowAt(c, l[0], l[1], l[2], l[3], l[4]);
  for (const t of tempLights) glowAt(c, t.x, t.y, t.r, t.col, t.a);
  c.globalCompositeOperation = 'source-over';
}
function drawFlash(c){
  if (flash.a < 0.01) return;
  c.globalCompositeOperation = 'lighter';
  c.fillStyle = rgba(flash.col, (flash.a * 0.22).toFixed(3)); c.fillRect(-30, -30, W + 60, H + 60);
  glowAt(c, flash.x, flash.y, (260 + 200 * flash.size) * Math.max(0.7, L.s), flash.col, flash.a);
  c.globalCompositeOperation = 'source-over';
}

/* ---------- frame ---------- */
let cursorNone = false;
function update(dt, k){
  lights.length = 0;
  wind = 0.1 + 0.07 * Math.sin(T * 0.17);
  updateFar(k);
  updateParts(k);
  for (let i = tempLights.length - 1; i >= 0; i--) { const t = tempLights[i]; t.a *= Math.pow(t.d, k); if (t.a < 0.01) tempLights.splice(i, 1); }
  flash.a *= Math.pow(0.84, k);
  shake = reduceMotion ? 0 : shake * Math.pow(0.85, k); if (shake < 0.15) shake = 0;
  ptr.vx *= Math.pow(0.82, k);
  if (match.lit) { match.flare *= Math.pow(0.9, k); const [hx, hy] = matchHead(); lights.push([hx, hy - 10, 120 + match.flare * 80, [255, 170, 80], 0.55 + match.flare * 0.3]); }
  if (state === 'lit') updateLit();
  if (cr) updateCracker(dt, k);
  if (pending && T >= pending.at) { const ok = pending.ok; pending = null; showResult(ok); }
  const wantNone = (state === 'strike' || state === 'lit') && !coarse;
  if (wantNone !== cursorNone) { cursorNone = wantNone; cv.style.cursor = wantNone ? 'none' : ''; }
}
function updateLit(){
  if (T - match.t0 > match.life) {
    const [hx, hy] = matchHead();
    for (let i = 0; i < 3; i++) spawn(smoke(hx, hy - 6, rand(-0.3, 0.3), rand(-0.7, -0.3), rand(2, 4), 0.3, 0.3, 70));
    newMatch(); state = 'strike'; setPrompt('That match burnt down. Strike a fresh one.'); return;
  }
  if (!cr || cr.phase !== 'idle') return;
  const [hx, hy] = matchHead(), g = fuseGeom(cr), rad = ptr.type === 'touch' ? 20 : 15;
  for (let i = 0; i <= 6; i++) { const q = qpt(g, i / 12); if (Math.hypot(q[0] - hx, q[1] - (hy - 6)) < rad) { lightFuse(); return; } }
}
function render(){
  const c = ctx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0); c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  c.fillStyle = '#05040f'; c.fillRect(0, 0, W, H);
  if (shake > 0) c.translate(rand(-shake, shake), rand(-shake, shake) * 0.7);
  c.drawImage(skyL, 0, 0, W, H);
  if (towerLight && (T % 1.6) < 0.55) { c.globalCompositeOperation = 'lighter'; glowAt(c, towerLight.x, towerLight.y, 14, [255, 40, 40], 0.9); c.globalCompositeOperation = 'source-over'; }
  drawFar(c);
  c.drawImage(frontL, 0, 0, W, H);
  drawTVs(c); drawBulbs(c); drawKandils(c); drawDiyas(c); drawLamp(c);
  c.drawImage(debrisL, 0, 0, W, H);
  if (cr) drawCracker(c, cr);
  drawSmoke(c); drawPapers(c); drawSparks(c);
  drawMatchbox(c); drawMatch(c);
  drawLights(c); drawFlash(c);
}
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now; T += dt;
  update(dt, dt * 60); render();
  requestAnimationFrame(loop);
}

/* ---------- UI ---------- */
function setPrompt(t){ promptEl.textContent = t; promptEl.classList.remove('off'); }
function hidePrompt(){ promptEl.classList.add('off'); }
const strikePrompt = () => coarse ? 'Drag the matchstick across the brown strip on the matchbox' : 'Strike the match: click and drag it across the brown strip on the matchbox';
function buildTray(){
  ORDER.forEach((id, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'box'; b.dataset.id = id; b.setAttribute('aria-pressed', 'false');
    b.innerHTML = `<kbd aria-hidden="true">${i + 1}</kbd>${ICONS[id]}<b>${CR[id].name}</b><small>${CR[id].sub}</small>`;
    b.addEventListener('click', () => { Snd.init(); choose(id); });
    trayInner.appendChild(b);
  });
}
function markTray(){ trayInner.querySelectorAll('.box').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === selType))); }
function setTrayEnabled(on){ trayInner.querySelectorAll('.box').forEach(b => { b.disabled = !on; }); }
function updateScore(){ $('#scoreBoom b').textContent = score.boom; $('#scoreDud b').textContent = score.dud; }
function showResult(ok){
  state = 'result';
  if (ok) score.boom++; else score.dud++;
  updateScore();
  const info = ok ? WIN[cr.type] : DUDS[Math.floor(Math.random() * DUDS.length)];
  $('#cardEmoji').textContent = info.e; $('#cardTitle').textContent = info.t;
  $('#cardSub').textContent = info.s + (ok && cr.alarm ? ' Somebody’s car alarm is going off.' : '');
  cardEl.hidden = false; void cardEl.offsetWidth; cardEl.classList.add('show');
  hidePrompt(); setTrayEnabled(true);
  try { btnAgain.focus({ preventScroll: true }); } catch (e) {}
}
function hideCard(){ cardEl.classList.remove('show'); cardEl.hidden = true; }
function choose(type){
  if (!['select', 'strike', 'lit', 'result'].includes(state)) return;
  hideCard();
  if (fxSnd) { fxSnd.stop(); fxSnd = null; }
  placeCracker(type); selType = type; markTray(); setTrayEnabled(true);
  if (match.lit) { state = 'lit'; setPrompt(type === 'snake' ? 'Now touch the flame to the tablet' : 'Now touch the flame to the end of the fuse 🔥'); }
  else { newMatch(); state = 'strike'; setPrompt(strikePrompt()); }
}
function tryAgain(){ if (state !== 'result' || !selType) return; choose(selType); }
function pickAnother(){
  if (state !== 'result') return;
  hideCard(); selType = null; markTray(); state = 'select'; setPrompt('Pick a cracker from the tray below');
  const first = trayInner.querySelector('.box'); if (first) try { first.focus({ preventScroll: true }); } catch (e) {}
}
function start(){
  if (state !== 'intro') return;
  Snd.init(); Snd.bell();
  introEl.classList.add('leave'); document.body.classList.add('playing');
  setTimeout(() => { introEl.hidden = true; }, 950);
  state = 'select'; setPrompt('Pick a cracker from the tray below');
}

/* ---------- input ---------- */
function setPtr(e, reset){
  ptr.type = e.pointerType || 'mouse';
  const off = ptr.type === 'touch' ? [-6, -46] : ptr.type === 'pen' ? [0, -18] : [0, 0];
  const hx = e.clientX + off[0], hy = e.clientY + off[1];
  if (reset || !ptr.known) { ptr.px = hx; ptr.py = hy; } else { ptr.px = ptr.hx; ptr.py = ptr.hy; ptr.vx = lerp(ptr.vx, hx - ptr.hx, 0.5); }
  ptr.hx = hx; ptr.hy = hy; ptr.x = e.clientX; ptr.y = e.clientY; ptr.known = true;
}
function onMove(){
  if (state !== 'strike' || !ptr.down) return;
  const s = L.striker, hx = ptr.hx, hy = ptr.hy;
  if (hx > s.x - 6 && hx < s.x + s.w + 6 && hy > s.y - 10 && hy < s.y + s.h + 8) {
    const d = Math.hypot(hx - ptr.px, hy - ptr.py);
    if (d > 0.5) {
      scrape += d;
      if (d > 3 && Math.random() < 0.5) spawn(spark(hx, hy, rand(-2, 2), rand(-2.5, 0), rand(4, 9), [255, 210, 150], 0.8, 0.9, 0.12));
      if (T - lastScratch > 0.06) { Snd.scratch(Math.min(1, d / 20)); lastScratch = T; }
      marks.push([clamp(ptr.px, s.x, s.x + s.w), clamp(ptr.py, s.y + 2, s.y + s.h - 2), clamp(hx, s.x, s.x + s.w), clamp(hy, s.y + 2, s.y + s.h - 2)]);
      if (marks.length > 60) marks.shift();
    }
    if (scrape >= strikeNeed) igniteMatch();
  }
}
cv.addEventListener('pointerdown', e => { if (state === 'intro') return; Snd.init(); ptr.down = true; try { cv.setPointerCapture(e.pointerId); } catch (_) {} setPtr(e, true); });
cv.addEventListener('pointermove', e => { setPtr(e); onMove(); });
cv.addEventListener('pointerup', () => { ptr.down = false; });
cv.addEventListener('pointercancel', () => { ptr.down = false; });
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') ptr.known = false; });

window.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (state === 'intro') { e.preventDefault(); start(); return; }
    const ae = document.activeElement; if (ae && ae.tagName === 'BUTTON') return;
    if (state === 'result') { e.preventDefault(); tryAgain(); }
    return;
  }
  if (state === 'intro') return;
  if (/^[1-7]$/.test(e.key)) { Snd.init(); choose(ORDER[+e.key - 1]); }
  else if (e.key === 'm' || e.key === 'M') muteBtn.click();
});
$('#startBtn').addEventListener('click', start);
btnAgain.addEventListener('click', tryAgain);
btnPick.addEventListener('click', pickAnother);
muteBtn.addEventListener('click', () => {
  Snd.init(); const m = !Snd.muted; Snd.setMuted(m);
  muteBtn.textContent = m ? '🔇' : '🔊'; muteBtn.setAttribute('aria-pressed', String(m)); muteBtn.setAttribute('aria-label', m ? 'Unmute sound' : 'Mute sound');
});

/* ---------- greeting ---------- */
function rangoliSVG(){
  const cols = ['#e8344a', '#f7c531', '#2fa36b', '#f07a1d', '#c43fa8', '#2f7ad6', '#fcebc4'];
  let s = '<svg viewBox="-100 -100 200 200">';
  [[94, 28, 9, 3.6], [76, 18, 12, 5.5], [55, 12, 12, 6.5], [34, 8, 10, 6]].forEach(([r, n, lx, ly], i) => {
    for (let k = 0; k < n; k++) s += `<ellipse cx="0" cy="${-r + lx}" rx="${ly}" ry="${lx}" transform="rotate(${(k * 360 / n + (i % 2) * 180 / n).toFixed(2)})" fill="${cols[i % cols.length]}"/>`;
    s += `<circle r="${r - 2 * lx - 3}" fill="none" stroke="${cols[(i + 3) % cols.length]}" stroke-width="1.4" stroke-dasharray="2 3"/>`;
  });
  for (let k = 0; k < 48; k++) { const a = k / 48 * TAU; s += `<circle cx="${(Math.cos(a) * 98).toFixed(2)}" cy="${(Math.sin(a) * 98).toFixed(2)}" r="1.3" fill="#fcebc4"/>`; }
  return s + '<circle r="9" fill="#f7c531"/><circle r="4" fill="#e8344a"/></svg>';
}
$('#rangoli').innerHTML = rangoliSVG();
const GREETS = [['शुभ दीपावली', 'Hindi', 'hi'], ['ದೀಪಾವಳಿ ಹಬ್ಬದ ಶುಭಾಶಯಗಳು', 'Kannada', 'kn'], ['దీపావళి శుభాకాంక్షలు', 'Telugu', 'te'], ['தீபாவளி நல்வாழ்த்துகள்', 'Tamil', 'ta'], ['ദീപാവലി ആശംസകൾ', 'Malayalam', 'ml'], ['শুভ দীপাবলি', 'Bengali', 'bn']];
let gi = 0;
const greetEl = $('#greet'), greetLine = $('#greetLine'), greetLang = $('#greetLang');
const greetTimer = setInterval(() => {
  if (state !== 'intro') { clearInterval(greetTimer); return; }
  greetEl.classList.add('fade');
  setTimeout(() => { gi = (gi + 1) % GREETS.length; const [t, n, l] = GREETS[gi]; greetLine.textContent = t; greetLine.lang = l; greetLang.textContent = n; greetEl.classList.remove('fade'); }, reduceMotion ? 0 : 450);
}, 2600);

/* ---------- boot ---------- */
buildTray(); setTrayEnabled(true);
resize();
let rt = 0;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 120); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => resize());
requestAnimationFrame(loop);

function resize(){
  const oldDebris = debrisL, oldDPR = DPR;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  computeLayout(); genBuildings(); renderSky(); renderFront();
  debrisL = makeLayer();
  if (oldDebris) debrisL.getContext('2d').drawImage(oldDebris, 0, 0, oldDebris.width / oldDPR, oldDebris.height / oldDPR);
  if (cr && cr.phase === 'idle') { cr.x = L.cx; cr.y = L.cy; }
}
})();
</script>
